version: '3.4'

volumes:
  postgres-data:

services:
  compreface-postgres-db:
    image: exadel/compreface-postgres-db:1.2.0
    restart: always
    container_name: "compreface-postgres-db"
    environment:
      - POSTGRES_USER=compreface
      - POSTGRES_PASSWORD=compreface
      - POSTGRES_DB=frs
    volumes:
      - postgres-data:/var/lib/postgresql/data

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    restart: always
    container_name: "compreface-admin"
    environment:
      - POSTGRES_USER=compreface
      - POSTGRES_PASSWORD=compreface
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/frs
      - SPRING_PROFILES_ACTIVE=dev
      - MAX_FILE_SIZE=5MB
      - MAX_REQUEST_SIZE=10MB
    depends_on:
      - compreface-postgres-db

  compreface-api:
    image: exadel/compreface-api:1.2.0
    restart: always
    container_name: "compreface-api"
    depends_on:
      - compreface-postgres-db
    environment:
      - POSTGRES_USER=compreface
      - POSTGRES_PASSWORD=compreface
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/frs
      - SPRING_PROFILES_ACTIVE=dev
      - MAX_FILE_SIZE=5MB
      - MAX_REQUEST_SIZE=10MB
      - CONNECTION_TIMEOUT=10000
      - READ_TIMEOUT=60000

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    restart: always
    container_name: "compreface-ui"
    ports:
      - "8000:80"
    depends_on:
      - compreface-api
      - compreface-admin

  compreface-core:
    image: exadel/compreface-core:1.2.0
    restart: always
    container_name: "compreface-core"
    environment:
      - ML_PORT=3000
